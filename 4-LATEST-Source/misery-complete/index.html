<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>坏心情有限公司 · 花田经营完整版</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="icons.css"><link rel="stylesheet" href="garden.css"></head><body>
<main id="stage" data-scene="shop">
<img id="background" src="assets/backgrounds/shop-clean.jpg" alt="阴雨欧洲小镇中的手绘炼金商店" draggable="false"><div class="vignette"></div>
<header id="header"><div class="brand"><small>MISERY &amp; CO.</small><h1 id="sceneTitle">阴雨小铺</h1></div><div id="hud"></div><button class="paper" data-action="help">?</button><button class="paper" data-action="settle">打烊</button></header>
<section id="shopScene" class="scene"><div id="shopPuppets" aria-hidden="true"><div class="puppet bird-body"></div><div class="puppet bird-head"></div><div class="puppet girl-body"></div><div class="girl-head-group"><div class="puppet girl-head"></div><span class="soft-blink"></span><span class="soft-blink blink-right"></span></div><div class="cat-group"><div class="puppet cat-body"></div></div><div class="puppet bow"></div></div><button class="rain-collect" data-action="rain" aria-label="收取檐下雨水"><img src="assets/sprites/bottle-empty.png" alt=""><span>雨水 +3</span></button><aside class="parchment order"><small>今日第 <span id="orderNumber">1</span> 位</small><h2 id="customerName"></h2><p id="customerText"></p><div id="orderArt"></div><button class="paper" data-action="toCraft" aria-label="去制作">去制作 →</button><div id="customerReply" role="status"></div></aside><div id="shopCustomer" class="resident-sprite" aria-hidden="true"></div><button id="shopCat" aria-label="摸摸黑猫" ><span id="catSprite"></span><span id="catBlend" aria-hidden="true"></span><span id="catHearts" aria-hidden="true">♡</span></button><div id="catStatus" role="status" aria-live="polite"></div><aside id="vnDialogue" aria-label="顾客对话"><div class="vn-portrait"><div id="vnFace" class="resident-sprite"></div></div><div class="vn-copy"><h2 id="vnSpeaker"></h2><p id="vnLine"></p></div><div class="vn-order" id="vnOrder"></div><button class="paper vn-accept" data-action="toCraft" aria-label="为顾客制作" title="制作">→</button></aside><div class="shop-lamp"></div><aside class="sales-panel"><h2>待交付</h2><div id="saleProducts"></div><button class="paper traditional" data-action="traditional"></button></aside></section>
<section id="craftScene" class="scene" hidden>
<button class="bench-note" id="benchHint" aria-label="制作提示" disabled></button><button class="paper cabinet-link" data-action="pantry">材料柜</button>
<div class="recipe-book"><img src="assets/sprites/book-open.png" alt="手绘配方书" draggable="false"><button class="paper" data-action="recipes">配方</button></div>
<div id="prepStation" hidden class="station prep-station" data-drop="prep"><div class="station-heading"><em>01</em><h2>材料处理</h2></div><div class="cut-board"></div><img class="mortar" src="assets/sprites/prop-mortar.png" alt="研钵" draggable="false"><div id="prepArt"></div><button id="pluck" class="petal-action" aria-label="摘下一片花瓣" data-action="pluck" hidden></button><button id="grind" class="grind-action" aria-label="按住研磨，或拖动沿研钵画圈" data-hold="grind"></button><div class="station-controls"><button class="paper" data-action="processPrep">放入</button><button class="paper" data-action="unprep">取回</button></div><div class="station-caption" id="prepLabel"></div><progress id="prepProgress" value="0" max="1"></progress></div>
<div id="kettleStation" class="station kettle-station" data-drop="kettle"><div class="station-heading"><em>02</em><h2>温热与调和</h2></div><div id="kettle" class="kettle" data-drag="kettle" tabindex="0" role="button" aria-label="浸泡壶，拖到右侧玻璃瓶倾倒"><div class="kettle-neck"></div><div class="kettle-glass"><div id="kettleLiquid" class="liquid"></div><div id="kettleContents"></div><div class="steam"><i></i><i></i><i></i></div></div><div class="kettle-handle"></div><div class="kettle-spout"></div></div><div class="burner"><i></i><i></i><i></i></div><button id="stir" class="stir-action" data-hold="stir" aria-label="按住搅拌，或在壶上画圈"></button><div class="station-controls"><button class="paper" data-action="add">加入</button><button id="heatButton" class="paper" data-action="heat">点火</button></div><div id="kettleLabel" class="station-caption"></div><progress id="heatProgress" value="0" max="1"></progress><progress id="stirProgress" value="0" max="1"></progress></div>
<div id="bottleStation" class="station bottle-station" data-drop="bottle"><div class="station-heading"><em>03</em><h2>过滤与封存</h2></div><div id="funnel" class="funnel" data-action="filter" role="button" tabindex="0" aria-label="安装或取下过滤漏斗"></div><div id="bottle" class="bottle"><img id="bottleArt" src="assets/sprites/bottle-empty.png" alt="装瓶区" draggable="false"><div id="bottleLiquid" class="bottle-liquid"></div><div id="residue"></div><div id="slime" hidden></div></div><button id="cork" class="cork" data-drag="cork" aria-label="将瓶塞拖到玻璃瓶，或点击封瓶">封瓶</button><div class="pour-stream"></div><div class="station-controls"><button id="pourButton" class="paper" data-hold="pour">按住倾倒</button><button class="paper" data-action="clear">退料</button></div><div id="bottleLabel" class="station-caption"></div></div>
<div class="work-tray"><img src="assets/sprites/prop-tray.png" alt="" draggable="false"><strong>备料盘</strong><div id="tray"></div><span id="selectedLabel">从材料柜拿取原料</span></div>
</section>
<section id="pantryScene" class="scene" hidden><div class="cabinet"><img src="assets/sprites/prop-cabinet.png" alt="木质材料柜" draggable="false"><div id="shelf"></div></div><aside class="pantry-intro parchment"><small>储藏室</small><h2>材料柜</h2><p>点取材料，带到工作台。</p><button class="paper" data-action="craft">带去工作台 →</button><button class="paper" data-action="gather">去果园</button><button class="paper garden-entry" data-action="garden" aria-label="进入手势花田">✿ 花田</button></aside><div class="pantry-tray"><h2>随身备料盘 · <span id="trayCount"></span></h2><div id="pantryTray"></div><p>选中 · 放回</p><button class="paper" data-action="putBack">放回柜子</button></div></section>
<section id="townScene" class="scene" hidden><button class="paper garden-entry town-garden" data-action="garden" aria-label="进入手势花田">✿</button><div id="townHotspots"></div><div class="town-dynamics"><div id="townResidents"></div><div class="town-glow"></div><div class="chimney"></div><div class="water-shimmer"></div><div class="festival-lantern"></div><div class="walker festival-guest guest-a"></div><div class="walker festival-guest guest-b"></div></div><aside class="town-note parchment"><small>雨巷来信</small><h2>今日雨巷</h2><p id="townStatus"></p></aside></section>
<section id="gatherScene" class="scene" hidden><button id="rainSky" aria-label="点击天空采集雨水" title="接雨"><span></span></button><div id="orchardLayers" aria-hidden="true"><div class="orchard-layer canopy"></div><div class="orchard-layer berry-sway"></div><div class="orchard-layer flowers-sway"></div><div class="orchard-lantern"></div><div class="orchard-mist"></div></div><button class="paper garden-entry orchard-garden" data-action="garden" aria-label="进入手势花田">✿</button><div id="gatherNodes"></div><div id="collector" class="walker collector" aria-hidden="true"></div><div id="footTarget" aria-hidden="true"></div><div id="collectEffect" hidden>✦</div><div class="orchard-help"><span id="orchardHint">点小路走动 · 靠近采集</span><button class="paper" data-action="pantry">回工坊 →</button></div><div id="harvestBasket" class="harvest-basket"><span>♧</span><div id="basketItems"></div></div><div id="harvestPanel" hidden><button id="harvestClose" aria-label="收起采集">×</button><h2 id="harvestTitle"></h2><div id="harvestInteraction"></div><div id="harvestHint"></div><div id="harvestDrop" aria-label="放入采集篮">♧</div></div></section>
<div id="driftingLeaves" aria-hidden="true"></div><canvas id="weather" width="1920" height="1080" aria-hidden="true"></canvas>
<nav id="mainNav"><button data-scene="shop">⌂ 接待顾客</button><button data-scene="craft">⚗ 制作商品</button><button data-scene="town">♧ 前往小镇</button></nav><div id="toast" role="status"></div><div id="saveStatus">进度自动保存在本机</div>
</main><div id="dragGhost" hidden></div><dialog id="modal"><button class="close" data-action="close" aria-label="关闭">×</button><div id="modalBody"></div></dialog><section id="gardenOverlay" hidden aria-label="手势花田"><iframe id="gardenFrame" title="掌心花田" allow="camera *; fullscreen *"></iframe><button id="leaveGarden">← 返回小镇</button><span id="gardenConnection" role="status"></span></section><script src="icons.js"></script><script src="game.js"></script><script src="orchard.js"></script><script src="ui.js"></script><script src="motion.js"></script><script src="residents.js"></script><script src="guidance.js"></script><script src="garden-bridge.js"></script></body></html>
