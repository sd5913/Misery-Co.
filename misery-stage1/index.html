<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>坏心情有限公司 · 小镇互动版</title><link rel="stylesheet" href="style.css"></head>
<body><main id="stage" data-scene="craft" aria-label="坏心情有限公司制作界面"><img id="background" class="background" src="assets/backgrounds/craft.jpg" alt="原风格手绘魔法工作台"><div class="shade"></div>
<section id="craftScene" class="scene" aria-label="第一人称制作工作台">
<header class="title"><span class="eyebrow">MISERY & CO.</span><h1>制作商品</h1><p>把一点坏心情，变成可以收藏的温柔。</p></header>
<button class="image-button back" data-asset="button-back" aria-label="返回商店" onclick="setScene('shop')"></button>
<button class="image-button book-toggle" data-asset="button-book" aria-label="查看配方书封面" onclick="toggleBook()"></button>
<button class="image-button help-button" data-asset="button-help" aria-label="界面说明" onclick="showHelp()"></button>
<button class="book" aria-label="合上配方书" onclick="toggleBook()"><img id="recipeBook" src="assets/sprites/book-open.png" alt="原画配方书：雨云加花朵，蘑菇加羽毛，枫叶加浆果加雨云"></button>
<div class="book-caption"><span id="bookLabel">配方手记</span><i>Ⅰ — Ⅲ</i></div>
<div class="bottle-area" aria-label="玻璃瓶位置"><div class="bottle-shadow"></div><img src="assets/sprites/bottle-empty.png" class="bottle" alt="空玻璃瓶"><div class="ingredient-slots" aria-label="预留三个材料位置"><span>Ⅰ</span><span>Ⅱ</span><span>Ⅲ</span></div></div>
<div class="bottle-caption"><span>等待一份新配方</span><small>投入 2–3 种材料</small></div>
<section class="material-area" aria-label="材料盘"><img class="tray" src="assets/sprites/prop-tray.png" alt="原画木质材料盘"><button class="arrow arrow-left" aria-label="上一组材料" onclick="turnMaterials(-1)">‹</button><div id="materialItems"></div><button class="arrow arrow-right" aria-label="下一组材料" onclick="turnMaterials(1)">›</button><div id="materialDots" class="material-dots"></div></section>
<button class="image-button make" data-asset="button-craft" aria-label="制作商品（视觉预览）" onclick="previewMake()"></button><div class="page-mark">配方工坊 <span>·</span> 雨巷 13 号</div>
</section>
<section id="townBuildings" class="scene town-buildings" aria-label="可走访的小镇建筑" hidden></section>
<section id="otherScene" class="scene" hidden><div class="scene-top"><h1 id="otherTitle"></h1><button class="paper-button" onclick="setScene('craft')">返回制作工作台 →</button></div><nav class="bottom-nav"><button onclick="setScene('shop')">接待顾客</button><button onclick="setScene('craft')">制作商品</button><button onclick="setScene('town')">前往小镇</button></nav></section>
<div id="townSummary" class="town-summary" hidden></div>
<div id="toast" role="status"></div><div class="review-mark">小镇互动版</div></main>
<dialog id="info"><button class="close" aria-label="关闭说明" onclick="document.querySelector('#info').close()">×</button><div id="infoBody"></div><button class="paper-button" onclick="document.querySelector('#info').close()">回到工作台</button></dialog>
<dialog id="townDialog" class="town-dialog" aria-label="小镇来访与市政委托"><button class="close" aria-label="关闭小镇窗口" onclick="document.querySelector('#townDialog').close()">×</button><div id="townDialogBody"></div><button class="paper-button town-return" onclick="document.querySelector('#townDialog').close()">返回小镇</button></dialog>
<script src="preview.js"></script><script src="town.js"></script></body></html>
